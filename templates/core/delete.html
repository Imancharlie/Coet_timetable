{% load core_tags %}

<form method="post" action="{{ delete_url }}"
      hx-post="{{ delete_url }}" hx-target="#modal-content" hx-swap="innerHTML">
    {% csrf_token %}
    <div class="text-center py-4">
        <div class="w-14 h-14 mx-auto mb-4 rounded-full bg-red-50 flex items-center justify-center text-red-500">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        </div>
        <h3 class="text-lg font-semibold text-gray-800">Delete {{ item }}?</h3>
        <p class="text-sm text-gray-500 mt-1">This action cannot be undone. Related records may be affected.</p>
    </div>
    <div class="mt-6 flex justify-end gap-3">
        <button type="button" @click="modalOpen = false" class="px-4 py-2 text-sm font-medium text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
            Cancel
        </button>
        <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-lg transition">
            Yes, Delete
        </button>
    </div>
</form>
