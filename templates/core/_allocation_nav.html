<form method="get" action="."
      class="grid grid-cols-1 gap-3 min-w-0
             sm:grid-cols-2
             lg:grid-cols-[minmax(0,1fr)_minmax(0,1fr)_auto]
             lg:items-end">
    <div class="min-w-0">
        <label for="{{ nav_prefix }}-nav-semester"
               class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1.5">Semester</label>
        <select name="semester" id="{{ nav_prefix }}-nav-semester" onchange="this.form.submit()"
                class="w-full min-w-0 px-3 py-2.5 border border-gray-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            {% for s in semesters %}
            <option value="{{ s.pk }}" {% if semester and s.pk == semester.pk %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="min-w-0">
        <label for="{{ nav_prefix }}-nav-scope"
               class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1.5">Activities</label>
        <select name="scope" id="{{ nav_prefix }}-nav-scope" onchange="this.form.submit()"
                class="w-full min-w-0 px-3 py-2.5 border border-gray-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            {% for value, label in scopes %}
            <option value="{{ value }}" {% if scope == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="min-w-0 sm:col-span-2 lg:col-span-1">
        <a href="{% url 'allocation-page' %}"
           class="inline-flex w-full items-center justify-center gap-1.5 px-4 py-2.5 text-sm font-medium text-gray-700 border border-gray-300 bg-white rounded-lg hover:bg-gray-50 transition">
            Run the allocator
        </a>
    </div>
</form>
