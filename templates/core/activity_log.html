{% extends "base.html" %}
{% load core_tags %}

{% block content %}
<div class="max-w-7xl mx-auto">
    <div class="text-sm text-gray-500 mb-4">{{ total }} activity event{{ total|pluralize }}</div>

    <!-- Filter bar -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 mb-4">
        <form method="get" action=".">
            <div class="flex flex-col md:flex-row gap-3">
                <div class="flex-1 relative">
                    <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    <input type="text" name="q" value="{{ q }}" placeholder="Search activity..."
                           class="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                {% for f in filters %}
                    {% if f.type == "select" %}
                    <select name="{{ f.name }}" class="shrink-0 px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="">All {{ f.label }}s</option>
                        {% for v, label in f.options %}
                        <option value="{{ v }}" {% if f.value == v %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                    {% endif %}
                {% endfor %}
                <button type="submit" class="px-4 py-2 bg-gray-800 text-white text-sm font-medium rounded-lg hover:bg-gray-900 transition">
                    Filter
                </button>
                <a href="?" class="px-4 py-2 text-sm font-medium text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
                    Reset
                </a>
            </div>
        </form>
    </div>

    <!-- Events -->
    <div id="data-table-wrap"
         hx-get="{{ list_url }}{{ query }}"
         hx-trigger="refresh from:window"
         hx-swap="innerHTML">
        {% include "core/_activity_log.html" %}
    </div>
</div>
{% endblock %}
