{% extends "base.html" %}
{% load core_tags %}

{% block content %}
<div class="max-w-7xl mx-auto">
    <div class="text-sm text-gray-500 mb-4">{{ total }} activity event{{ total|pluralize }}</div>

    <!-- Filter bar -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 mb-4">
        <form method="get" action=".">
            <div class="flex flex-col md:flex-row gap-3">
                <div class="flex-1 relative">
                    <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    <input type="text" name="q" value="{{ q }}" placeholder="Search activity..."
                           class="w-full pl-9 pr-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                {% for f in filters %}
                    {% if f.type == "select" %}
                    <select name="{{ f.name }}" class="w-full md:w-auto shrink-0 px-3 py-2.5 border border-gray-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="">All {{ f.label }}s</option>
                        {% for v, label in f.options %}
                        <option value="{{ v }}" {% if f.value == v %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                    {% endif %}
                {% endfor %}
                <div class="flex gap-2 w-full md:w-auto">
                    <button type="submit" class="flex-1 md:flex-none px-4 py-2.5 bg-gray-800 text-white text-sm font-medium rounded-lg hover:bg-gray-900 transition">
                        Filter
                    </button>
                    <a href="?" class="flex-1 md:flex-none flex items-center justify-center px-4 py-2.5 text-sm font-medium text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
                        Reset
                    </a>
                </div>
            </div>
        </form>
    </div>

    <!-- Events -->
    <div class="relative">
        <div id="data-table-wrap"
             hx-get="{{ list_url }}{{ query }}"
             hx-trigger="refresh from:window"
             hx-swap="innerHTML"
             hx-settle="220"
             hx-indicator="#loading-indicator">
            {% include "core/_activity_log.html" %}
        </div>
        <div id="loading-indicator"
             class="htmx-indicator absolute inset-0 z-10 rounded-xl bg-white/60 flex flex-col items-center justify-center gap-2">
            <svg class="animate-spin w-6 h-6 text-blue-600" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
            <span class="text-sm text-gray-500">Loading data...</span>
        </div>
    </div>
</div>
{% endblock %}
