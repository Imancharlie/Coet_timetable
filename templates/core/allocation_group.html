{% extends "base.html" %}
{% load core_tags %}

{% block content %}
<div class="max-w-5xl mx-auto space-y-4 min-w-0">
    <a href="{{ back_url }}" class="inline-flex items-center gap-1.5 text-sm text-gray-500 hover:text-gray-700">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        All groups
    </a>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 min-w-0">
        <div class="min-w-0 mb-3">
            <h2 class="text-base font-semibold text-gray-800 break-safe">
                {{ group.programme.code }} {{ group.code }} &mdash; {{ group.programme.name }}
            </h2>
            <p class="text-xs text-gray-500 mt-0.5">
                {{ semester }}
            </p>
        </div>
        {% include "core/_allocation_nav.html" with nav_prefix="group" %}
    </div>

    {% include "core/_allocation_group_panel.html" %}
</div>
{% endblock %}
