{% load core_tags %}

<div class="space-y-6">
    <dl class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-4">
        {% for field in detail_fields %}
        <div>
            <dt class="text-xs font-medium text-gray-500 uppercase tracking-wide">{{ field.label }}</dt>
            <dd class="mt-1 text-sm text-gray-800">
                {% if field.key == 'start_time' or field.key == 'end_time' %}
                    {{ item|get_attr:field.key|time_short }}
                {% else %}
                    {{ item|get_attr:field.key }}
                {% endif %}
            </dd>
        </div>
        {% endfor %}
    </dl>

    {% block detail_extra %}{% endblock %}

    <div class="pt-4 border-t border-gray-100 flex flex-wrap gap-2">
        <button onclick="openEdit('{{ edit_url }}')"
                class="inline-flex items-center gap-1.5 px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
            Edit
        </button>
        <button onclick="openDelete('{{ delete_url }}')"
                class="inline-flex items-center gap-1.5 px-4 py-2 text-sm font-medium text-red-700 bg-red-50 hover:bg-red-100 rounded-lg transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            Delete
        </button>
    </div>
</div>
